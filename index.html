<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビジュアルルート・脱出シミュレーター</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0b0e;
            color: #e3e3e6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 580px;
            background-color: #141419;
            border: 1px solid #23232f;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #23232f;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00bcd4;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-badge {
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-normal { background: rgba(0, 188, 212, 0.15); color: #00bcd4; border: 1px solid #00bcd4; }
        .badge-hard { background: rgba(244, 67, 54, 0.15); color: #f44336; border: 1px solid #f44336; }

        /* 💡 ビジュアルルートマップ（点と線の表示エリア） */
        .map-container {
            position: relative;
            width: 100%;
            height: 120px;
            background-color: #0d0d11;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #1a1a24;
            overflow: hidden;
        }

        .svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 線の青いアニメーション */
        .route-line {
            stroke: #1a1a26;
            stroke-width: 3;
            transition: stroke 0.5s ease;
        }
        .route-line.active {
            stroke: #00bcd4;
            stroke-dasharray: 8;
            animation: lineFlow 2s linear infinite;
        }

        @keyframes lineFlow {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        /* 点（ノード）のスタイル */
        .node {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #1a1a26;
            border: 2px solid #333344;
            border-radius: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }
        .node.active {
            background-color: #00bcd4;
            border-color: #ffffff;
            box-shadow: 0 0 12px #00bcd4;
        }
        .node.clear { background-color: #4caf50; border-color: #ffffff; box-shadow: 0 0 12px #4caf50; }
        .node.fail { background-color: #f44336; border-color: #ffffff; box-shadow: 0 0 12px #f44336; }

        /* テキスト表示エリア */
        .story-box {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #d1d1d6;
            margin-bottom: 24px;
            min-height: 90px;
            white-space: pre-wrap;
        }

        /* 選択肢ボタン */
        .choices-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-choice {
            background-color: #1c1c24;
            color: #ffffff;
            border: 1px solid #2d2d3d;
            padding: 14px 16px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }
        .btn-choice:hover {
            background-color: #242431;
            border-color: #00bcd4;
        }

        .btn-system {
            background-color: #2a1a1a;
            border-color: #4a2525;
            color: #ff9800;
            text-align: center;
            font-weight: 600;
        }
        .btn-system:hover { background-color: #361f1f; border-color: #ff9800; }

        .text-win { color: #4caf50; font-weight: bold; }
        .text-lose { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h2 class="title">⚡ ROUTE SIMULATOR</h2>
        <div id="mode-indicator" class="mode-badge badge-normal">NORMAL MODE</div>
    </div>
    
    <!-- 💡 点と線のビジュアルルートマップ -->
    <div class="map-container">
        <svg class="svg-layer">
            <!-- スタートから各ルートへの線 -->
            <line id="line-door" class="route-line" x1="50" y1="60" x2="200" y2="30" />
            <line id="line-panel" class="route-line" x1="50" y1="60" x2="200" y2="60" />
            <line id="line-vent" class="route-line" x1="50" y1="60" x2="200" y2="90" />
            
            <!-- 扉からの展開 -->
            <line id="line-s_door" class="route-line" x1="200" y1="30" x2="380" y2="30" />
            <line id="line-f_door" class="route-line" x1="200" y1="30" x2="380" y2="50" />
            
            <!-- 配電盤からの展開 -->
            <line id="line-s_panel" class="route-line" x1="200" y1="60" x2="380" y2="60" />
            <line id="line-f_panel" class="route-line" x1="200" y1="60" x2="380" y2="75" />
            
            <!-- 通気口からの展開 -->
            <line id="line-s_vent" class="route-line" x1="200" y1="90" x2="380" y2="90" />
            <line id="line-f_vent" class="route-line" x1="200" y1="90" x2="380" y2="105" />
        </svg>

        <!-- 座標配置された点（ノード） -->
        <div id="node-start" class="node active" style="left: 50px; top: 60px;"></div>
        
        <div id="node-door" class="node" style="left: 200px; top: 30px;"></div>
        <div id="node-panel" class="node" style="left: 200px; top: 60px;"></div>
        <div id="node-vent" class="node" style="left: 200px; top: 90px;"></div>
        
        <div id="node-s_door" class="node" style="left: 380px; top: 30px;"></div>
        <div id="node-f_door" class="node" style="left: 380px; top: 50px;"></div>
        <div id="node-s_panel" class="node" style="left: 380px; top: 60px;"></div>
        <div id="node-f_panel" class="node" style="left: 380px; top: 75px;"></div>
        <div id="node-s_vent" class="node" style="left: 380px; top: 90px;"></div>
        <div id="node-f_vent" class="node" style="left: 380px; top: 105px;"></div>
    </div>
    
    <div id="story-display" class="story-box"></div>
    <div id="choices-display" class="choices-box"></div>
</div>

<script>
    let currentMode = 'normal';

    const gameData = {
        select_mode: {
            text: "【シミュレーション起動】\nゲームの難易度を選択してください。\n\n※ハードモードではヒントが消失し、1つのミスで即座にロックダウン（システム強制終了）となります。",
            choices: [
                { text: "NORMAL MODE （ヒントあり・リトライ可能）", action: () => { currentMode = 'normal'; loadScene('start'); } },
                { text: "HARD MODE （ヒントなし・一撃デス）", action: () => { currentMode = 'hard'; loadScene('start'); } }
            ],
            nodes: ['start'], lines: []
        },
        start: {
            text: "気が付くと、あなたは無機質なコンクリートに囲まれた見知らぬ部屋に横たわっていた。\n\n正面には重厚な『鉄製の扉』、横には怪しげな『配電盤』が剥き出しになっている。また、部屋の隅には古い『通気口の格子』がガタついている。壁の警告灯がゆっくりと点滅を始めた。",
            choices: [
                { text: "正面の扉を詳しく調べてみる", next: "door" },
                { text: "剥き出しの配電盤を操作してみる", next: "panel" },
                { text: "ガタついている通気口をこじ開ける", next: "vent" }
            ],
            nodes: ['start'], lines: []
        },
        door: {
            text: "【扉の前】\n扉のテンキーの横に『3つのデジタル数字』を入力する画面がある。足元には古いノートが落ちていた。\n\n" + (currentMode === 'normal' ? "💡ノーマルヒント: ノートに『実験番号：104の裏。反転させろ』とある。" : "⚠️ハード警告: ノートの文字は擦り切れて読めない。直感を信じろ。"),
            choices: [
                { text: "テンキーに「401」と入力する", next: "success_door" },
                { text: "テンキーに「104」と入力する", next: "fail_door" }
            ],
            nodes: ['start', 'door'], lines: ['line-door']
        },
        panel: {
            text: "【配電盤の前】\n配電盤の中に赤と青の太い配線が絡み合っている。電磁ロックを切るにはどちらかの線を切断する必要があるようだ。\n\n" + (currentMode === 'normal' ? "💡ノーマルヒント: 青い線の奥に「安全」の刻印が見える。" : "⚠️ハード警告: 配線はすべて激しく火花を散らしている。"),
            choices: [
                { text: "青い配線を切断する", next: "success_panel" },
                { text: "赤い配線を強引に引き抜く", next: "fail_panel" }
            ],
            nodes: ['start', 'panel'], lines: ['line-panel']
        },
        vent: {
            text: "【通気口内部】\n狭いダクトの中を這って進むと、途中で道が左右に分岐していた。\n\n" + (currentMode === 'normal' ? "💡ノーマルヒント: 左からは冷たい外の風が吹き込んでくる。" : "⚠️ハード警告: 暗闇で五感が狂い、風の方向がわからない。"),
            choices: [
                { text: "左の通路へ進む", next: "success_vent" },
                { text: "右の通路へ進む", next: "fail_vent" }
            ],
            nodes: ['start', 'vent'], lines: ['line-vent']
        },
        success_door: {
            text: "<span class='text-win'>【生還：正面解錠エンド】</span>\n\nカチャリと音が響き扉が開いた！あなたは自身の洞察力によって、安全に生還を果たした！",
            choices: [], nodes: ['start', 'door', 's_door'], lines: ['line-door', 'line-s_door'], end: 'clear'
        },
        fail_door: {
            text: "<span class='text-lose'>【ゲームオーバー：トラップ作動】</span>\n\nエラー音が鳴り響き、高圧の催眠ガスが噴射された。あなたの意識は完全に闇に沈んだ…。",
            choices: [], nodes: ['start', 'door', 'f_door'], lines: ['line-door', 'line-f_door'], end: 'fail'
        },
        success_panel: {
            text: "<span class='text-win'>【生還：システムダウンエンド】</span>\n\n部屋の明かりが消え、電磁ロックが解除された！手探りで扉を開け、脱出に成功した！",
            choices: [], nodes: ['start', 'panel', 's_panel'], lines: ['line-panel', 'line-s_panel'], end: 'clear'
        },
        fail_panel: {
text: "【ゲームオーバー：強力感電】\n\nバリバリッ！と強烈な電流が全身を襲った。あなたは防犯電流に直撃し、その場に崩れ落ちた。",
choices: [], nodes: ['start', 'panel', 'f_panel'], lines: ['line-panel', 'line-f_panel'], end: 'fail'
},
success_vent: {
text: "【生還：通気口ハッチエンド】\n\nハッチを突き破るとそこは外の森だった。あなたは誰にも見つかることなく無事に脱出を遂げた！",
choices: [], nodes: ['start', 'vent', 's_vent'], lines: ['line-vent', 'line-s_vent'], end: 'clear'
},
fail_vent: {
text: "【ゲームオーバー：ダクト火災】\n\n右の先は施設の焼却炉だった！引き返すこともできず、煙の中であなたの息は途絶えた。",
choices: [], nodes: ['start', 'vent', 'f_vent'], lines: ['line-vent', 'line-f_vent'], end: 'fail'
}
};
function resetVisuals() {
document.querySelectorAll('.node').forEach(n => n.className = 'node');
document.querySelectorAll('.route-line').forEach(l => l.className.baseVal = 'route-line');
}
function loadScene(sceneKey) {
const scene = gameData[sceneKey];
// ヘッダーの難易度表示更新
const indicator = document.getElementById('mode-indicator');
if (sceneKey === 'select_mode') {
indicator.innerText = "SETUP";
indicator.className = "mode-badge badge-normal";
resetVisuals();
document.getElementById('node-start').classList.add('active');
} else {
indicator.innerText = currentMode === 'normal' ? "NORMAL MODE" : "HARD MODE";
indicator.className = currentMode === 'normal' ? "mode-badge badge-normal" : "mode-badge badge-hard";
}
// テキスト更新
document.getElementById('story-display').innerHTML = scene.text;
// 💡 点と線のビジュアル更新
if (sceneKey !== 'select_mode') {
resetVisuals();
// 通過した線をアクティブ（青いアニメーション）にする
scene.lines.forEach(lineId => {
const line = document.getElementById(lineId);
if (line) line.className.baseVal = 'route-line active';
});
// 通過した点をアクティブにする
scene.nodes.forEach(nodeId => {
const node = document.getElementById(node-${nodeId});
if (node) node.classList.add('active');
});
// 終了ノードのカラーリング変更
if (scene.end) {
const endNodeId = scene.nodes[scene.nodes.length - 1];
const endNode = document.getElementById(node-${endNodeId});
if (endNode) {
endNode.classList.remove('active');
endNode.classList.add(scene.end); // clear または fail
}
}
}
// ボタンの生成
const choicesContainer = document.getElementById('choices-display');
choicesContainer.innerHTML = '';
if (scene.choices.length > 0) {
scene.choices.forEach(c => {
const btn = document.createElement('button');
btn.className = 'btn-choice';
btn.innerText = c.text;
btn.onclick = c.action ? c.action : () => loadScene(c.next);
choicesContainer.appendChild(btn);
});
} else {
// エンディングに達した場合
const retryBtn = document.createElement('button');
retryBtn.className = 'btn-choice btn-system';
retryBtn.innerText = "タイトル（難易度選択）に戻る";
retryBtn.onclick = () => loadScene('select_mode');
choicesContainer.appendChild(retryBtn);
}
}
// 初期起動
loadScene('select_mode');
</script>
</body>
</html>
