<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下ダンジョン脱出ゲーム：暗黒回廊からの生還</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #121214;
            color: #e0e0e6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e24;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2e2e38;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2e2e38;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4caf50;
            margin: 0;
        }

        .badge {
            background-color: #2e2e38;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a0a0ab;
        }

        /* 🗺️ ネットワークマップUIのスタイル */
        .route-map-container {
            background-color: #16161a;
            border: 1px solid #2e2e38;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .route-map-title {
            font-size: 0.85rem;
            color: #a0a0ab;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .route-svg-map {
            width: 100%;
            height: 150px;
            display: block;
        }

        .map-edge-line {
            stroke: #3f3f4f;
            stroke-width: 1.5;
            stroke-dasharray: 3,3;
        }

        .map-node-passed {
            fill: #707080;
            stroke: #16161a;
            stroke-width: 1.5;
        }

        .map-node-current {
            fill: #2196f3;
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 4px #2196f3);
        }

        .map-node-dead {
            fill: #f44336;
            stroke: #16161a;
            stroke-width: 1.5;
        }

        /* テキストエリア */
        .text-area {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
            min-height: 120px;
            white-space: pre-wrap;
        }

        .choice-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #2a2a35;
            color: #ffffff;
            border: 1px solid #3f3f4f;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #353545;
            border-color: #4caf50;
            transform: translateY(-1px);
        }

        .btn-retry {
            background-color: #3a2a1e;
            border-color: #5a402e;
            color: #ffc107;
            text-align: center;
            font-weight: bold;
        }

        .btn-retry:hover {
            background-color: #4a3828;
            border-color: #ffc107;
        }

        .restart-container {
            margin-top: 15px;
            text-align: center;
        }

        .btn-small-reset {
            background: none;
            border: none;
            color: #707080;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 5px 10px;
        }

        .btn-small-reset:hover {
            color: #f44336;
        }

        /* 🗺️ 縦積み筒状マップUIのスタイル */
.route-map-container {
    background-color: #16161a;
    border: 1px solid #2e2e38;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
}

.route-map-title {
    font-size: 0.85rem;
    color: #a0a0ab;
    margin-bottom: 8px;
    font-weight: bold;
}

.route-scroll-wrapper {
    max-height: 140px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 0;
    scroll-behavior: smooth;
}

.route-floor-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: #22222a;
    border: 1px solid #3f3f4f;
    padding: 8px 16px;
    border-radius: 20px;
    width: 80%;
    max-width: 320px;
    transition: all 0.2s ease;
}

.floor-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #555566;
}

.floor-label {
    font-size: 0.9rem;
    color: #a0a0ab;
}

/* 状態ごとのスタイル */
.floor-passed {
    border-color: #4caf50;
    color: #ffffff;
}
.floor-passed .floor-dot {
    background-color: #4caf50;
}

.floor-current {
    background-color: #1a2736;
    border-color: #2196f3;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(33, 150, 243, 0.4);
    font-weight: bold;
}
.floor-current .floor-dot {
    background-color: #2196f3;
    box-shadow: 0 0 6px #2196f3;
}

.floor-dead {
    background-color: #361a1a;
    border-color: #f44336;
}
.floor-dead .floor-dot {
    background-color: #f44336;
}

.floor-unvisited {
    opacity: 0.5;
}

.floor-connector {
    width: 2px;
    height: 15px;
    background-color: #3f3f4f;
}

.connector-active {
    background-color: #4caf50;
}
        
        .success-text { color: #4caf50; font-weight: bold; }
        .danger-text { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1 class="title">⚔️ DUNGEON ESCAPE</h1>
        <div id="status-badge" class="badge">探索中</div>
    </div>
    
    <div id="text-display" class="text-area"></div>
    <div id="choice-display" class="choice-container"></div>
</div>

    <script src="storyData.js"></script>
    <script src="gameEngine.js"></script>
</body>
</html>
