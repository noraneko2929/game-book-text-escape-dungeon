<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下ダンジョン脱出ゲーム：暗黒回廊からの生還</title>
    <style>
        /* 全体のダークモード風デザイン */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #121214;
            color: #e0e0e6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e24;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2e2e38;
        }

        /* ヘッダー・ステータス表示 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2e2e38;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4caf50;
            margin: 0;
        }

        .badge {
            background-color: #2e2e38;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #a0a0ab;
        }

        /* テキストエリア */
        .text-area {
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
            min-height: 120px;
            white-space: pre-wrap;
        }

        /* 選択肢ボタンエリア */
        .choice-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #2a2a35;
            color: #ffffff;
            border: 1px solid #3f3f4f;
            padding: 14px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #353545;
            border-color: #4caf50;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* ゲームオーバー時の直前選択肢リトライボタン */
        .btn-retry {
            background-color: #3a2a1e;
            border-color: #5a402e;
            color: #ffc107;
            text-align: center;
            font-weight: bold;
        }

        .btn-retry:hover {
            background-color: #4a3828;
            border-color: #ffc107;
        }

        /* 「最初からやり直す」控えめなボタン表示 */
        .restart-container {
            margin-top: 15px;
            text-align: center;
        }

        .btn-small-reset {
            background: none;
            border: none;
            color: #707080;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 5px 10px;
            transition: color 0.2s ease;
        }

        .btn-small-reset:hover {
            color: #f44336;
        }
        
        .success-text { color: #4caf50; font-weight: bold; }
        .danger-text { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1 class="title">⚔️ DUNGEON ESCAPE</h1>
        <div id="status-badge" class="badge">探索中</div>
    </div>
    
    <!-- 物語が表示される場所 -->
    <div id="text-display" class="text-area"></div>
    
    <!-- 選択肢ボタンが表示される場所 -->
    <div id="choice-display" class="choice-container"></div>
</div>

    <!-- 外部JavaScriptファイルの読み込み -->
    <script src="storyData.js"></script>
    <script src="gameEngine.js"></script>
</body>
</html>
